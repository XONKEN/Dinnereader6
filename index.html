<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今晚回家吃飯嗎">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>今晚回家吃飯嗎？</title>
<style>
:root{--blue:#3b82f6;--blue2:#2563eb;--ink:#111827;--muted:#6b7280;--bg:#eef6ff;--card:#fff;--line:#e5e7eb;--danger:#ef4444;--green:#16a34a}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow-x:hidden}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:24px}.top{padding:38px 20px 16px;padding-top:calc(38px + env(safe-area-inset-top))}.eyebrow{font-size:11px;letter-spacing:.2em;color:#6b7280}.title{font-size:24px;font-weight:800;margin:5px 0 0}.subtitle{font-size:14px;color:#6b7280;margin-top:5px}.section{padding:0 20px;margin-top:20px}.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-radius:22px;padding:22px;box-shadow:0 10px 28px rgba(59,130,246,.28)}.hero:after{content:"";position:absolute;right:-25px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1)}.hero .small{font-size:13px;color:rgba(255,255,255,.82)}.hero .day{font-size:25px;font-weight:800;margin-top:14px}.hero .time{font-size:56px;line-height:1;font-weight:900;letter-spacing:-2px;margin-top:4px}.hero .body{font-size:14px;color:rgba(255,255,255,.82);margin-top:12px}.bell{position:absolute;right:16px;bottom:12px;font-size:46px;z-index:1}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:15px;margin:0}.count{font-size:12px;color:#6b7280}.dayrow,.card{background:white;border-radius:15px;box-shadow:0 2px 7px rgba(17,24,39,.06)}.dayrow{display:flex;align-items:center;gap:12px;padding:13px 14px;margin:8px 0}.daynum{width:32px;height:32px;border-radius:10px;background:#eaf3ff;color:var(--blue2);display:grid;place-items:center;font-weight:800;font-size:13px}.dayinfo{flex:1;min-width:0}.dayname{font-size:14px;font-weight:700}.daytime{font-size:12px;color:#6b7280;margin-top:2px}.switch{width:46px;height:26px;border-radius:20px;border:0;background:#d1d5db;padding:3px;transition:.2s;flex:0 0 auto}.switch:after{content:"";display:block;width:20px;height:20px;border-radius:50%;background:white;transition:.2s;box-shadow:0 1px 3px #0002}.switch.on{background:var(--blue)}.switch.on:after{transform:translateX(20px)}.empty{padding:22px;text-align:center;color:#6b7280;font-size:14px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);min-height:74px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid #e5e7eb;display:flex;gap:6px;z-index:100}.nav{flex:1;border:0;background:transparent;border-radius:12px;padding:7px 4px;color:#6b7280;font-size:11px;min-width:0}.nav .ico{display:block;font-size:20px;line-height:22px;margin-bottom:2px}.nav.active{color:var(--blue2);background:#eff6ff;font-weight:700}.settingline{display:flex;align-items:center;gap:12px;padding:10px 0}.settingline+.settingline{border-top:1px solid #f0f0f0}.settingtext{flex:1;min-width:0}.settingtitle{font-size:14px;font-weight:700}.settingdesc{font-size:12px;color:#6b7280;margin-top:3px;line-height:1.5}.input{width:100%;border:0;background:#eef6ff;border-radius:10px;padding:10px 12px;outline:none;margin-top:5px}.timeinput{width:90px;border:0;background:#eef6ff;border-radius:9px;padding:7px 8px;text-align:center}.btn{width:100%;border:0;border-radius:11px;padding:12px;font-weight:700}.btn+.btn{margin-top:8px}.primary{background:var(--blue);color:white}.secondary{background:#eff6ff;color:var(--blue2)}.danger{background:#fff;color:var(--danger);border:1px solid #fee2e2}.choice{display:flex;gap:8px;margin-top:14px}.choice button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800}.homebtn{background:var(--blue);color:#fff}.awaybtn{background:#f3f4f6;color:#4b5563}.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;z-index:200;transition:.25s;max-width:88%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.log{display:flex;align-items:center;gap:12px}.logdate{flex:1}.badge{border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;white-space:nowrap}.badge.home{background:var(--blue);color:white}.badge.away{background:#f3f4f6;color:#4b5563}.muted{color:#6b7280;font-size:13px}.notice{font-size:12px;color:#6b7280;line-height:1.6}.hide{display:none!important}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700;background:#eff6ff;color:var(--blue2)}.member{display:flex;align-items:center;gap:10px;padding:10px 0}.avatar{width:34px;height:34px;border-radius:50%;background:#eaf3ff;color:var(--blue2);display:grid;place-items:center;font-weight:800}.member .settingtext{flex:1}.msg{padding:11px 0;border-bottom:1px solid #f0f0f0}.msg:last-child{border-bottom:0}.msghead{display:flex;justify-content:space-between;gap:8px}.msgname{font-weight:800;font-size:13px}.msgtime{font-size:11px;color:#9ca3af}.msgbody{font-size:13px;color:#374151;margin-top:4px}.code{font-size:26px;letter-spacing:4px;font-weight:900;text-align:center;background:#eff6ff;border-radius:13px;padding:12px;color:var(--blue2)}.textarea{min-height:76px;resize:vertical}.smallbtn{width:auto;padding:9px 12px}.rowbuttons{display:flex;gap:8px}.rowbuttons>*{flex:1}.statusok{color:var(--green);font-weight:700}.statusbad{color:var(--danger);font-weight:700}@media(min-width:700px){body{padding-bottom:20px}.app{box-shadow:0 0 40px rgba(0,0,0,.05)}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(() => {
'use strict';
const DAYS=['星期一','星期二','星期三','星期四','星期五','星期六','星期日'],SHORT=['一','二','三','四','五','六','日'];
const KEY='dinner-reminder-settings-v3',LOGKEY='dinner-reminder-logs-v3',USERKEY='dinner-reminder-user-v1',GROUPKEY='dinner-reminder-group-v1',FIREKEY='dinner-reminder-firebase-v1';
const defaults={defaultTime:'19:00',notificationsOn:true,title:'吃飯時間到了 🍚',body:'今天要回家吃飯嗎？',weekendOn:true,days:[1,0,1,1,0,1,1].map((enabled,i)=>({enabled:!!enabled,time:['19:00','19:00','19:00','19:30','19:00','18:30','19:00'][i]}))};
let settings=load(KEY,defaults),logs=load(LOGKEY,[]),page='home',permission='',toastTimer=null,firedKey='',choiceBoxShown=false;
let fb={app:null,auth:null,db:null,user:null,groupId:localStorage.getItem(GROUPKEY)||'',unsubGroup:null,unsubMessages:null,messagesReady:false};
function load(k,f){try{const x=localStorage.getItem(k);if(!x)return clone(f);const v=JSON.parse(x);if(k===KEY){v.days=Array.isArray(v.days)?v.days:clone(f.days);v.days=v.days.slice(0,7);while(v.days.length<7)v.days.push({enabled:false,time:v.defaultTime||'19:00'});return {...f,...v}}return Array.isArray(v)?v:f}catch{return clone(f)}}
function clone(x){return JSON.parse(JSON.stringify(x))} function save(){localStorage.setItem(KEY,JSON.stringify(settings));localStorage.setItem(LOGKEY,JSON.stringify(logs))}
function dayIndex(d=new Date()){return (d.getDay()+6)%7} function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function active(i){return settings.notificationsOn&&(settings.weekendOn||i<5)&&!!settings.days[i]?.enabled}
function nextReminder(){const now=new Date();for(let n=0;n<8;n++){const d=new Date(now);d.setDate(now.getDate()+n);const i=dayIndex(d);if(!active(i))continue;const [h,m]=(settings.days[i].time||settings.defaultTime).split(':').map(Number);d.setHours(h||0,m||0,0,0);if(d>now)return{i,time:settings.days[i].time,at:d}}return null}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function nav(){return `<nav class="bottom"><button class="nav ${page==='home'?'active':''}" data-page="home"><span class="ico">🏠</span>首頁</button><button class="nav ${page==='days'?'active':''}" data-page="days"><span class="ico">📅</span>每日設定</button><button class="nav ${page==='history'?'active':''}" data-page="history"><span class="ico">📝</span>紀錄</button><button class="nav ${page==='settings'?'active':''}" data-page="settings"><span class="ico">⚙️</span>設定</button></nav>`}
function header(label,title,sub){return `<header class="top"><div class="eyebrow">${label}</div><h1 class="title">${title}</h1><div class="subtitle">${sub}</div></header>`}
function home(){const n=nextReminder(),count=settings.days.filter((_,i)=>active(i)).length;let rows=DAYS.map((d,i)=>`<div class="dayrow"><div class="daynum">${SHORT[i]}</div><div class="dayinfo"><div class="dayname">${d}</div><div class="daytime">${active(i)?settings.days[i].time:'提醒關閉'}</div></div><button class="switch ${active(i)?'on':''}" data-toggle="${i}" aria-label="${d}提醒"></button></div>`).join('');return `${header('DINING REMINDER','今晚回家吃飯嗎？','本週提醒總覽')}<section class="section"><div class="hero"><div class="small">● 下一次提醒</div><div class="day">${n?DAYS[n.i]:'尚未設定'}</div><div class="time">${n?n.time:'--:--'}</div><div class="body">要不要回家吃飯？</div><div class="bell">🔔</div></div></section><section class="section"><div class="section-head"><h2>本週提醒</h2><span class="count">${count} 天已開啟</span></div>${rows}</section>${nav()}`}
function days(){return `${header('SCHEDULE','每日設定','逐日調整提醒時間與開關')}<section class="section"><div class="card">${DAYS.map((d,i)=>`<div class="settingline"><div class="settingtext"><div class="settingtitle">${d}</div><div class="settingdesc">${active(i)?'已開啟提醒':'未開啟提醒'}</div></div><input class="timeinput" type="time" value="${esc(settings.days[i].time)}" data-time="${i}" ${settings.days[i].enabled?'':'disabled'}><button class="switch ${settings.days[i].enabled?'on':''}" data-toggle="${i}" aria-label="${d}提醒"></button></div>`).join('')}</div><div class="card"><div class="settingline"><div class="settingtext"><div class="settingtitle">週末提醒</div><div class="settingdesc">關閉後星期六、日不會提醒</div></div><button class="switch ${settings.weekendOn?'on':''}" data-weekend></button></div></div></section>${nav()}`}
function settingsPage(){const firebaseReady=!!fb.db;return `${header('SETTINGS','設定','通知與 App 行為')}<section class="section"><div class="card"><div class="settingline"><div class="settingtext"><div class="settingtitle">提醒通知</div><div class="settingdesc">開啟後依每日設定提醒</div></div><button class="switch ${settings.notificationsOn?'on':''}" data-notify></button></div></div><div class="card"><div class="settingtitle">通知文字</div><label class="notice">標題<input class="input" data-title value="${esc(settings.title)}"></label><label class="notice">內容<input class="input" data-body value="${esc(settings.body)}"></label></div><div class="card"><button class="btn primary" data-permission>允許手機通知</button><button class="btn secondary" data-test>立即測試通知</button><p class="notice">${permission==='denied'?'目前瀏覽器拒絕通知，請到瀏覽器或網站設定重新允許。':'建議先按「允許手機通知」，再按「立即測試通知」。若 App 完全關閉，純 GitHub Pages 無法保證定時通知；要做到關閉後仍準時，需要 Push 後端。'}</p></div><div class="card"><div class="settingtitle">家庭群組雲端</div><p class="notice">${firebaseReady?'<span class="statusok">● 雲端已連線</span>':'尚未連線。群組需要一個 Firebase 免費專案，README 有完整設定方法。'}</p><button class="btn secondary" data-firebase>${firebaseReady?'重新設定雲端':'設定群組雲端'}</button><button class="btn primary" data-page="group">開啟家庭群組</button></div></section>${nav()}`}
function groupPage(){if(!fb.db)return `${header('FAMILY GROUP','家庭群組','讓群組成員互相看到吃飯回覆')}<section class="section"><div class="card"><div class="settingtitle">先連接雲端</div><p class="notice">這個功能需要 Firebase。GitHub Pages 本身只能放靜態檔案，無法讓不同手機直接同步資料。請照 README 設定一次，之後所有成員就能用群組。</p><button class="btn primary" data-firebase>設定 Firebase</button></div></section>${nav()}`;let gid=fb.groupId;return `${header('FAMILY GROUP','家庭群組',gid?'群組代碼：'+gid:'建立或加入一個群組')}<section class="section">${gid?groupConnected():groupJoinCreate()}</section>${nav()}`}
function getName(){return localStorage.getItem(USERKEY)||'成員'} function groupJoinCreate(){return `<div class="card"><div class="settingtitle">你的名稱</div><p class="notice">群組裡會用這個名稱顯示你的回覆。</p><input class="input" data-nickname placeholder="例如：爸爸、媽媽、永程" maxlength="20" value="${esc(getName())}"></div><div class="card"><div class="settingtitle">建立新群組</div><p class="notice">建立後會產生一組群組代碼，把代碼給家人即可加入。</p><input class="input" data-groupname placeholder="群組名稱，例如：我們家" maxlength="30"><button class="btn primary" data-create-group>建立群組</button></div><div class="card"><div class="settingtitle">加入現有群組</div><input class="input" data-joincode placeholder="輸入群組代碼" maxlength="12" autocapitalize="characters"><button class="btn secondary" data-join-group>加入群組</button></div>`}
function groupConnected(){return `<div class="card"><div class="settingtitle">我的名稱</div><input class="input" data-nickname value="${esc(getName())}" maxlength="20"></div><div class="card"><div class="settingtitle">群組代碼</div><div class="code">${esc(fb.groupId)}</div><p class="notice">把這組代碼傳給家人即可加入。</p><div class="rowbuttons"><button class="btn secondary smallbtn" data-copy-code>複製代碼</button><button class="btn danger smallbtn" data-leave-group>離開群組</button></div></div><div class="card"><div class="section-head"><h2>成員</h2><span class="pill">即時同步</span></div><div id="members"><div class="empty">載入中…</div></div></div><div class="card"><div class="settingtitle">群組吃飯回覆</div><p class="notice">你自己按首頁提醒中的「回家吃飯／今天不回家」，群組成員都會看到。</p><div id="messages"><div class="empty">載入中…</div></div></div>`}
function history(){const sorted=[...logs].sort((a,b)=>b.at.localeCompare(a.at));const content=sorted.length?sorted.map(l=>`<div class="card log"><div class="logdate"><div class="settingtitle">${formatDate(l.date)}</div><div class="muted">${esc(l.time)}</div></div><span class="badge ${l.choice==='home'?'home':'away'}">${l.choice==='home'?'今天回家吃飯':'今天不回家'}</span></div>`).join(''):`<div class="card empty">還沒有任何紀錄</div>`;return `${header('HISTORY','紀錄','依日期查看過去的選擇')}<section class="section">${content}${sorted.length?'<button class="btn danger" data-clear>清除全部紀錄</button>':''}</section>${nav()}`}
function formatDate(k){const [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return `${m}月${d}日（${SHORT[dayIndex(dt)]}）`}
function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='days'?days():page==='history'?history():page==='group'?groupPage():settingsPage();if(page==='group'&&fb.db&&fb.groupId){loadGroupData()}}
async function askPermission(){if(!('Notification'in window)){permission='unsupported';toast('此瀏覽器不支援網頁通知');render();return}try{permission=await Notification.requestPermission();toast(permission==='granted'?'通知已允許':'通知未允許');render()}catch{toast('無法取得通知權限')}}
async function notify(text=settings.body,title=settings.title){if(!('Notification'in window)||Notification.permission!=='granted'){toast('請先允許通知');return false}try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.ready;await reg.showNotification(title,{body:text,tag:'dinner-reminder',icon:'./icon-192.png',badge:'./icon-192.png'});return true}new Notification(title,{body:text,tag:'dinner-reminder'});return true}catch{try{new Notification(title,{body:text});return true}catch{toast('目前環境無法發送通知');return false}}}
function addLog(choice,time=new Date().toTimeString().slice(0,5)){const d=dateKey();logs=[{id:d+'-'+Date.now(),date:d,time,choice,at:new Date().toISOString()},...logs.filter(x=>x.date!==d)];save();toast(choice==='home'?'已記錄：今天回家吃飯':'已記錄：今天不回家');if(fb.db&&fb.groupId)publishReply(choice,time);render()}
function showChoiceBox(reminderTime){if(choiceBoxShown)return;choiceBoxShown=true;const sec=document.querySelector('.section');if(!sec)return;const box=document.createElement('div');box.className='card';box.innerHTML=`<div class="settingtitle">${esc(settings.body)}</div><div class="notice">提醒時間 ${esc(reminderTime)}</div><div class="choice"><button class="homebtn" data-choice="home">回家吃飯</button><button class="awaybtn" data-choice="away">今天不回家</button></div>`;sec.prepend(box);box.addEventListener('click',e=>{if(e.target.dataset.choice){addLog(e.target.dataset.choice,reminderTime);box.remove();choiceBoxShown=false}})}
function currentReminder(){const now=new Date(),i=dayIndex(now);if(!active(i))return null;const time=settings.days[i].time||settings.defaultTime;const [h,m]=time.split(':').map(Number);const target=new Date(now);target.setHours(h||0,m||0,0,0);const diff=now.getTime()-target.getTime();if(diff>=0&&diff<90000)return{time,at:target,i};return null}
async function checkReminder(){const r=currentReminder();if(!r)return;const key=dateKey(r.at)+'-'+r.i+'-'+r.time;if(firedKey===key)return;firedKey=key;await notify();showChoiceBox(r.time)}
function firebaseConfig(){try{return JSON.parse(localStorage.getItem(FIREKEY)||'null')}catch{return null}}
async function initFirebase(){const cfg=firebaseConfig();if(!cfg||!window.firebase)return false;try{fb.app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);fb.auth=firebase.auth();fb.db=firebase.firestore();fb.user=fb.auth.currentUser||await fb.auth.signInAnonymously().then(r=>r.user);return true}catch(e){console.error(e);return false}}
function askFirebase(){const old=firebaseConfig();const raw=prompt('請貼上 Firebase Web App 設定 JSON（README 有取得方法）',old?JSON.stringify(old):'{"apiKey":"","authDomain":"","projectId":"","storageBucket":"","messagingSenderId":"","appId":""}');if(raw===null)return;try{const cfg=JSON.parse(raw);['apiKey','authDomain','projectId','appId'].forEach(k=>{if(!cfg[k])throw new Error('缺少 '+k)});localStorage.setItem(FIREKEY,JSON.stringify(cfg));initFirebase().then(ok=>{toast(ok?'雲端連線成功':'雲端連線失敗，請檢查 Firebase 設定');render()})}catch{toast('Firebase 設定格式不正確')}}
function randomCode(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=chars[Math.floor(Math.random()*chars.length)];return s}
async function createGroup(){if(!fb.db||!fb.user)return toast('請先連接雲端');const name=(document.querySelector('[data-groupname]')?.value||'我們家').trim();const nickname=(document.querySelector('[data-nickname]')?.value||'成員').trim()||'成員';localStorage.setItem(USERKEY,nickname);const code=randomCode();try{await fb.db.collection('groups').doc(code).set({name,createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:fb.user.uid});await fb.db.collection('groups').doc(code).collection('members').doc(fb.user.uid).set({name:nickname,joinedAt:firebase.firestore.FieldValue.serverTimestamp()});fb.groupId=code;localStorage.setItem(GROUPKEY,code);toast('群組建立成功：'+code);render()}catch(e){console.error(e);toast('建立失敗，請確認 Firestore 規則')}}
async function joinGroup(){if(!fb.db||!fb.user)return toast('請先連接雲端');const code=(document.querySelector('[data-joincode]')?.value||'').trim().toUpperCase(); const nickname=(document.querySelector('[data-nickname]')?.value||'成員').trim()||'成員'; localStorage.setItem(USERKEY,nickname);if(code.length<6)return toast('請輸入正確群組代碼');try{const ref=fb.db.collection('groups').doc(code),snap=await ref.get();if(!snap.exists)return toast('找不到這個群組');await ref.collection('members').doc(fb.user.uid).set({name:nickname,joinedAt:firebase.firestore.FieldValue.serverTimestamp()});fb.groupId=code;localStorage.setItem(GROUPKEY,code);toast('加入成功');render()}catch(e){console.error(e);toast('加入失敗，請確認 Firestore 規則')}}
async function publishReply(choice,time){try{const ref=fb.db.collection('groups').doc(fb.groupId).collection('messages');await ref.add({uid:fb.user.uid,name:getName(),choice,time,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){console.error(e)}}
function loadGroupData(){if(fb.unsubGroup)fb.unsubGroup();if(fb.unsubMessages)fb.unsubMessages();const gref=fb.db.collection('groups').doc(fb.groupId);fb.unsubGroup=gref.collection('members').onSnapshot(s=>{const el=document.getElementById('members');if(!el)return;el.innerHTML=s.empty?'<div class="empty">還沒有其他成員</div>':s.docs.map(d=>`<div class="member"><div class="avatar">👤</div><div class="settingtext"><div class="settingtitle">${esc(d.data().name||'成員')}${d.id===fb.user?.uid?'（你）':''}</div><div class="settingdesc">已加入群組</div></div></div>`).join('')},e=>console.error(e));fb.messagesReady=false;fb.unsubMessages=gref.collection('messages').orderBy('createdAt','desc').limit(30).onSnapshot(s=>{const el=document.getElementById('messages');if(!el)return;el.innerHTML=s.empty?'<div class="empty">還沒有回覆</div>':s.docs.map(d=>{const x=d.data();const when=x.createdAt?.toDate?x.createdAt.toDate():new Date();return `<div class="msg"><div class="msghead"><span class="msgname">${esc(x.name||'成員')}</span><span class="msgtime">${when.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span></div><div class="msgbody">${x.choice==='home'?'🏠 今天回家吃飯':'🚫 今天不回家'}</div></div>`}).join('');if(fb.messagesReady&&s.docs[0]&&s.docs[0].data().uid!==fb.user?.uid){const x=s.docs[0].data();notify((x.name||'群組成員')+'：'+(x.choice==='home'?'今天回家吃飯':'今天不回家'),'群組新回覆').catch(()=>{})}fb.messagesReady=true},e=>console.error(e))}
async function leaveGroup(){if(!fb.groupId)return;try{await fb.db.collection('groups').doc(fb.groupId).collection('members').doc(fb.user.uid).delete()}catch(e){}if(fb.unsubGroup)fb.unsubGroup();if(fb.unsubMessages)fb.unsubMessages();fb.groupId='';localStorage.removeItem(GROUPKEY);toast('已離開群組');render()}
function handle(e){const t=e.target.closest('button');if(!t)return;if(t.dataset.page){page=t.dataset.page;render();return}if(t.dataset.toggle!==undefined){const i=+t.dataset.toggle;settings.days[i].enabled=!settings.days[i].enabled;save();render();return}if(t.dataset.weekend!==undefined){settings.weekendOn=!settings.weekendOn;save();render();return}if(t.dataset.notify!==undefined){settings.notificationsOn=!settings.notificationsOn;save();render();return}if(t.dataset.permission!==undefined){askPermission();return}if(t.dataset.test!==undefined){notify('這是一則測試通知','今晚回家吃飯嗎？');return}if(t.dataset.clear!==undefined){if(confirm('確定要清除全部紀錄嗎？')){logs=[];save();render()}return}if(t.dataset.firebase!==undefined){askFirebase();return}if(t.dataset.createGroup!==undefined){createGroup();return}if(t.dataset.joinGroup!==undefined){joinGroup();return}if(t.dataset.copyCode!==undefined){navigator.clipboard?.writeText(fb.groupId).then(()=>toast('群組代碼已複製')).catch(()=>toast(fb.groupId));return}if(t.dataset.leaveGroup!==undefined){leaveGroup();return}}
document.addEventListener('click',handle);document.addEventListener('change',e=>{const t=e.target;if(t.dataset.time!==undefined){settings.days[+t.dataset.time].time=t.value||'19:00';save();render()}if(t.dataset.title!==undefined){settings.title=t.value;save()}if(t.dataset.body!==undefined){settings.body=t.value;save()}});document.addEventListener('input',e=>{const t=e.target;if(t.dataset.nickname!==undefined){localStorage.setItem(USERKEY,t.value.trim()||'成員')} if(t.dataset.title!==undefined){settings.title=t.value;save()}if(t.dataset.body!==undefined){settings.body=t.value;save()}});
async function start(){render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(firebaseConfig())await initFirebase();render();checkReminder();setInterval(checkReminder,5000)}
start();
})();
</script></body></html>
